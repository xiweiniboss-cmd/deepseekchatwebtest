<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>可乐站·DeepSeek</title>
<style>
:root{ --acc:#4D6BFE; --bg:#0f0f13; --card:#1a1a21; --text:#f1f1f3; --muted:#9a9aa3; --user:#2a2a34; }
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; }
body{ margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; display:flex; flex-direction:column; }
header{ padding:12px 16px; border-bottom:1px solid #22222b; display:flex; align-items:center; gap:10px; background:var(--bg); position:sticky; top:0; z-index:10; }
header h1{ font-size:17px; margin:0; font-weight:700; }
header .dot{ width:9px; height:9px; border-radius:50%; background:#3ddc84; }
#modelSel{ margin-left:auto; background:#1a1a21; color:var(--text); border:1px solid #2c2c36; border-radius:10px; font-size:13px; padding:8px 10px; outline:none; }
#newBtn{ background:#1a1a21; color:var(--text); border:1px solid #2c2c36; border-radius:10px; font-size:13px; padding:8px 12px; cursor:pointer; }
#chat{ flex:1; overflow-y:auto; padding:16px 14px 12px; display:flex; flex-direction:column; gap:14px; max-width:760px; width:100%; margin:0 auto; }
.msg{ max-width:88%; padding:11px 14px; border-radius:16px; font-size:15px; line-height:1.75; word-break:break-word; white-space:pre-wrap; }
.msg.user{ align-self:flex-end; background:var(--acc); color:#fff; border-bottom-right-radius:6px; }
.msg.ai{ align-self:flex-start; background:var(--card); border-bottom-left-radius:6px; }
.msg.ai pre{ background:#101016; padding:10px; border-radius:8px; overflow-x:auto; font-size:13px; }
.msg.ai code{ font-family:ui-monospace,Menlo,monospace; font-size:13px; }
.msg .think{ color:var(--muted); font-size:13px; border-left:3px solid #2c2c36; padding-left:10px; margin-bottom:8px; white-space:pre-wrap; }
.msg .think.done{ font-size:12px; cursor:pointer; }
.msg .mtime{ font-size:11px; color:var(--muted); margin-top:6px; opacity:.7; }
.msg.user .mtime{ text-align:right; }
.msg .think .think-head{ color:var(--acc); user-select:none; }
.msg .think .think-body{ display:none; margin-top:6px; color:var(--muted); }
.msg .think.open .think-body{ display:block; }
.cursor::after{ content:"▍"; animation:blink 1s infinite; color:var(--acc); }
@keyframes blink{ 50%{ opacity:0; } }
#inputBar{ padding:10px 14px calc(10px + env(safe-area-inset-bottom)); border-top:1px solid #22222b; background:var(--bg); }
#toolRow{ max-width:760px; margin:0 auto 8px; display:flex; gap:10px; align-items:stretch; }
#thinkBox{ flex:1; background:#1a1a21; border:1px solid #2c2c36; border-radius:14px; padding:8px 14px 6px; }
#thinkHead{ display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--muted); margin-bottom:2px; }
#effortName{ color:var(--acc); font-weight:600; }
#effortSlider{ -webkit-appearance:none; appearance:none; width:100%; height:26px; background:transparent; margin:0; --trackbg:#2c2c36; }
#effortSlider::-webkit-slider-runnable-track{ height:12px; border-radius:8px; background:var(--trackbg); }
#effortSlider::-webkit-slider-thumb{ -webkit-appearance:none; width:24px; height:24px; border-radius:50%; background:#fff; margin-top:-6px; box-shadow:0 2px 6px rgba(0,0,0,.45); cursor:pointer; }
#effortSlider::-moz-range-track{ height:12px; border-radius:8px; background:#2c2c36; }
#effortSlider::-moz-range-progress{ height:12px; border-radius:8px; background:linear-gradient(90deg,#6d28d9,#4a9eff); }
#effortSlider::-moz-range-thumb{ width:22px; height:22px; border:none; border-radius:50%; background:#fff; }
#effortTicks{ display:flex; justify-content:space-between; font-size:11px; color:var(--muted); padding:0 2px; }
#effortTicks span.on{ color:var(--acc); font-weight:600; }
#webBox{ display:flex; align-items:center; gap:8px; background:#1a1a21; border:1px solid #2c2c36; border-radius:14px; padding:8px 12px; font-size:16px; }
.switch{ width:46px; height:26px; border-radius:14px; background:#2c2c36; position:relative; cursor:pointer; transition:background .2s; flex:none; }
.switch.on{ background:#4a9eff; }
.switch .knob{ position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:left .2s; }
.switch.on .knob{ left:23px; }
#inputWrap{ max-width:760px; margin:0 auto; display:flex; gap:8px; align-items:flex-end; }
#input{ flex:1; background:#1a1a21; border:1px solid #2c2c36; border-radius:14px; color:var(--text); font-size:15px; padding:12px 14px; outline:none; resize:none; max-height:120px; font-family:inherit; }
#input:focus{ border-color:var(--acc); }
#imgBtn{ flex:0 0 48px; height:48px; border:1px solid #2c2c36; border-radius:14px; background:#1a1a21; color:var(--text); font-size:20px; cursor:pointer; }
#sendBtn{ flex:0 0 52px; height:48px; border:none; border-radius:14px; background:var(--acc); color:#fff; font-size:18px; cursor:pointer; }
#sendBtn:disabled{ opacity:.5; }
#sendBtn.stop{ background:#e5484d; }
.msg-actions{ display:flex; gap:8px; margin-top:8px; }
.act-btn{ background:transparent; border:1px solid #2c2c36; color:var(--muted); border-radius:8px; font-size:12px; padding:5px 10px; cursor:pointer; }
.act-btn:active{ background:#2a2a34; }
.hint{ text-align:center; color:var(--muted); font-size:12px; padding:20px; line-height:2; }
.err{ align-self:center; background:rgba(229,72,77,.12); border:1px solid rgba(229,72,77,.4); color:#ff8ba0; font-size:13px; border-radius:12px; padding:10px 16px; max-width:88%; }
#fbBtn{ position:fixed; top:64px; right:14px; width:52px; height:52px;
        border-radius:50%; border:none; font-size:24px; background:var(--acc);
        box-shadow:0 4px 14px rgba(77,107,254,.45); cursor:pointer; z-index:60;
        touch-action:none; user-select:none; -webkit-user-select:none; }
#fbWrap{ display:none; position:fixed; inset:0; z-index:70; }
#fbWrap.show{ display:block; }
#fbWrap .backdrop{ position:absolute; inset:0; background:rgba(0,0,0,.65); }
#fbWrap .sheet{ position:absolute; left:0; right:0; bottom:0; background:var(--card); border:1px solid #2c2c36;
                border-bottom:none; border-radius:18px 18px 0 0; padding:18px 18px calc(20px + env(safe-area-inset-bottom));
                max-width:520px; margin:0 auto; max-height:88vh; overflow-y:auto; }
#fbWrap .sheet h3{ font-size:17px; margin:0 0 6px; }
#fbWrap .sheet p{ font-size:13px; color:var(--muted); line-height:1.7; margin:0 0 12px; }
#fbWrap textarea{ width:100%; min-height:90px; background:#101016; border:1px solid #2c2c36; border-radius:12px;
                  color:var(--text); font-size:14px; padding:12px; outline:none; resize:vertical; font-family:inherit; }
#fbWrap input[type=text]{ width:100%; background:#101016; border:1px solid #2c2c36; border-radius:12px;
                          color:var(--text); font-size:14px; padding:12px; outline:none; margin-top:10px; }
#fbWrap .row{ display:flex; gap:10px; margin-top:14px; }
#fbWrap .btn-ghost{ flex:1; background:#2a2a34; border:none; border-radius:12px; font-size:15px; padding:13px 0; color:var(--text); cursor:pointer; }
#fbWrap .btn-send{ flex:1; background:var(--acc); border:none; border-radius:12px; font-size:15px; padding:13px 0; color:#fff; cursor:pointer; font-weight:600; }
#fbErr{ display:none; color:#ff8ba0; font-size:13px; margin-top:10px; }
#fbToast{ display:none; position:fixed; left:50%; bottom:100px; transform:translateX(-50%); background:rgba(0,0,0,.85); color:#fff; font-size:13px; padding:10px 18px; border-radius:20px; z-index:99; }
#noticeWrap{ display:none; position:fixed; inset:0; z-index:120; align-items:center; justify-content:center; padding:24px; }
#noticeWrap.show{ display:flex; }
#noticeWrap .backdrop{ position:absolute; inset:0; background:rgba(0,0,0,.7); }
#noticeWrap .card{ position:relative; background:var(--card); border:1px solid #2c2c36; border-radius:18px; padding:24px 22px; width:100%; max-width:340px; }
#noticeWrap .card h3{ margin:0 0 12px; font-size:17px; text-align:center; }
#noticeWrap .card ol{ margin:0; padding-left:20px; font-size:14px; line-height:1.9; color:var(--text); }
#noticeWrap .card ol li{ margin-bottom:4px; }
#noticeWrap .nrow{ display:flex; align-items:center; gap:8px; margin:14px 0 12px; font-size:13px; color:var(--muted); cursor:pointer; }
#noticeWrap .nrow input{ width:16px; height:16px; accent-color:var(--acc); }
#noticeWrap .btn-ok{ width:100%; border:none; border-radius:12px; padding:13px 0; font-size:15px; font-weight:600; background:var(--acc); color:#fff; cursor:pointer; }
#loginWrap{ position:fixed; inset:0; z-index:100; background:var(--bg); display:flex; align-items:center; justify-content:center; padding:20px; }
#loginWrap.hide{ display:none; }
#loginBox{ background:var(--card); border:1px solid #2c2c36; border-radius:18px; padding:28px 24px; width:100%; max-width:340px; text-align:center; }
#loginBox h2{ margin:0 0 6px; font-size:20px; }
#loginBox p{ color:var(--muted); font-size:13px; margin:0 0 18px; line-height:1.7; }
#loginBox input{ width:100%; background:#101016; border:1px solid #2c2c36; border-radius:12px; color:var(--text); font-size:15px; padding:13px; outline:none; margin-bottom:12px; text-align:center; letter-spacing:1px; }
#loginBox input:focus{ border-color:var(--acc); }
#loginBox .lrow{ display:flex; gap:10px; margin-top:6px; }
#loginBox .lbtn{ flex:1; border:none; border-radius:12px; font-size:15px; padding:13px 0; cursor:pointer; font-weight:600; }
#loginBox .l-login{ background:var(--acc); color:#fff; }
#loginBox .l-reg{ background:#2a2a34; color:var(--text); }
#loginErr{ display:none; color:#ff8ba0; font-size:13px; margin-top:10px; }
#userBadge{ font-size:12px; color:var(--muted); background:#1a1a21; border:1px solid #2c2c36; padding:6px 10px; border-radius:20px; cursor:pointer; }
#userModal{ display:none; position:fixed; inset:0; z-index:90; align-items:center; justify-content:center; }
#userModal.show{ display:flex; }
#userModal .backdrop{ position:absolute; inset:0; background:rgba(0,0,0,.6); }
#userModal .card{ position:relative; background:var(--card); border:1px solid #2c2c36; border-radius:18px; padding:24px; width:280px; text-align:center; }
#userModal .card h3{ margin:0 0 12px; font-size:17px; }
#userModal .card .uinfo{ font-size:14px; color:var(--muted); line-height:2; margin-bottom:16px; }
#userModal .card .uinfo b{ color:var(--text); font-size:16px; }
#userModal .card button{ width:100%; border:none; border-radius:12px; padding:12px; font-size:15px; cursor:pointer; margin-top:8px; }
#userModal .btn-out{ background:#3a2028; color:#ff8ba0; }
#userModal .btn-close{ background:#2a2a34; color:var(--text); }
#histWrap{ display:none; position:fixed; inset:0; z-index:80; }
#histWrap.show{ display:block; }
#histWrap .backdrop{ position:absolute; inset:0; background:rgba(0,0,0,.6); }
#histWrap .drawer{ position:absolute; left:0; top:0; bottom:0; width:78%; max-width:300px; background:var(--card); border-right:1px solid #2c2c36; display:flex; flex-direction:column; }
#histWrap .dhead{ padding:16px; border-bottom:1px solid #2c2c36; font-size:16px; font-weight:600; display:flex; justify-content:space-between; align-items:center; }
#histWrap .dhead button{ background:none; border:none; color:var(--muted); font-size:20px; cursor:pointer; }
#histList{ flex:1; overflow-y:auto; padding:10px; }
.hist-item{ background:#1a1a21; border:1px solid #2c2c36; border-radius:12px; padding:12px; margin-bottom:8px; cursor:pointer; }
.hist-item.active{ border-color:var(--acc); }
.hist-item .t{ font-size:14px; margin-bottom:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.hist-item .d{ font-size:12px; color:var(--muted); display:flex; justify-content:space-between; }
.hist-item .del{ color:#ff8ba0; font-size:12px; padding:2px 6px; }
#newConvBtn{ margin:10px; background:var(--acc); color:#fff; border:none; border-radius:12px; padding:12px; font-size:15px; cursor:pointer; font-weight:600; }
#chatTsWrap{ display:flex; justify-content:center; padding:6px 0 2px; min-height:70px; }
#chatTsWrap .ts-tip{ font-size:12px; color:var(--muted); text-align:center; padding:8px; }
body::after{content:"";position:fixed;inset:0;background:url('/bg.jpg') center/cover no-repeat;opacity:.25;pointer-events:none;z-index:2147483647}</style>
</head>
<body>
<header>
  <span class="dot"></span>
  <h1>可乐站·DeepSeek</h1>

<div id="chat">
  <div class="hint">👋 你好，我是可乐站·DeepSeek<br>直接输入问题开始聊天，支持流式输出</div>
</div>
<div id="chatTsWrap"><div id="chatTs"></div></div>
<div id="inputBar">
  <div id="toolRow">
    <div id="thinkBox">
      <div id="thinkHead"><span>推理等级</span><span id="effortName">梁子</span></div>
      <input type="range" id="effortSlider" min="0" max="3" step="1" value="2">
      <div id="effortTicks"><span>关闭</span><span>小难梁</span><span>梁子</span><span>梁圣</span></div>
    </div>
    <div id="webBox"><span>🌐</span><span id="webSwitch" class="switch"><span class="knob"></span></span></div>

  </div>
  <input type="file" id="imgInput" accept="image/*" style="display:none">

    <img id="imgPrevImg" style="max-height:120px;border-radius:10px">
    <button id="imgRemove" style="position:absolute;top:-8px;left:110px;background:#e5484d;color:#fff;border:none;border-radius:50%;width:24px;height:24px;font-size:14px;cursor:pointer">×</button>
  </div>
</div>
<div id="noticeWrap">
  <div class="backdrop"></div>

    <h3>📢 公告</h3>

      <li>本站为可乐的DeepSeek站，为防止账号丢失请先注册，用户名和密码需要自行记住，本站无法找回</li>
      <li>如有bug欢迎使用反馈系统反馈</li>

    <div style="text-align:center;margin:8px 0 4px;"><img src="announcement.gif" alt="公告动图" style="max-width:220px;border-radius:12px;"></div>
    <label class="nrow"><input type="checkbox" id="noticeHide"> 下次不再显示</label>
    <button class="btn-ok" id="noticeOk">我知道了</button>
  </div>
</div>
<div id="loginWrap">
  <div id="loginBox">
    <h2>可乐站·DeepSeek</h2><p style="font-size:13px;color:var(--muted);margin:6px 0 18px">🔐 登录</p>
    <p>用户名：1-8个字母<br>密码：1-10位数字<br>聊天记录云端保存，换设备不丢</p>
    <input id="loginUser" maxlength="8" placeholder="用户名" autocomplete="off" autocapitalize="off">
    <input id="loginPass" type="password" maxlength="10" inputmode="numeric" placeholder="密码">
    <div class="lrow">
      <button class="lbtn l-reg" id="regBtn" onclick="doAuth('register')">注册</button>
      <button class="lbtn l-login" id="loginBtn" onclick="doAuth('login')">登录</button>
    </div>
    <div id="loginTs" style="display:flex;justify-content:center;margin:4px 0 8px;min-height:65px"></div><div id="loginErr"></div>
  </div>
</div>

<button id="fbBtn">💬</button>
<div id="fbWrap">
  <div class="backdrop"></div>
  <div class="sheet">
    <h3>💬 问题反馈</h3>
    <p>遇到 bug 或有建议？告诉我吧，可附图（最多3张，20MB内）</p>

<div id="fbToast"></div>

  </div>
</div>
<div id="userModal">
  <div class="backdrop" onclick="closeUserModal()"></div>
  <div class="card">
    <h3>👤 登录信息</h3>
    <div class="uinfo">用户名<br><b id="uinfoName">-</b><br><span style="font-size:12px">聊天记录云端同步中</span></div>

    <button class="btn-close" onclick="closeUserModal()">关闭</button>
  </div>
</div>
<div id="histWrap">
  <div class="backdrop" onclick="closeHist()"></div>
  <div class="drawer">
    <div class="dhead"><span>🕐 历史对话</span><button onclick="closeHist()">✕</button></div>
    <div id="histList"></div>
    <button id="newConvBtn" onclick="newConversation()">＋ 新对话</button>
  </div>
</div>
<script>
var $ = function(id){ return document.getElementById(id); };
var messages = []; // {role, content}
var aborter = null;
var sending = false;

// 简单 markdown：代码块 + 行内代码 + 换行
function escHtml(t){ return String(t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function md(t){
  var esc = t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  esc = esc.replace(/```(\w*)\n([\s\S]*?)```/g, function(m, lang, code){
    return '<pre><code>' + code.replace(/^\n+|\n+$/g,'') + '</code></pre>';
  });
  esc = esc.replace(/`([^`\n]+)`/g, '<code style="background:#101016;padding:2px 6px;border-radius:6px">$1</code>');
  return esc;
}
function addMsg(role, html, ts, msgIdx){
  var d = document.createElement('div');
  d.className = 'msg ' + role;
  if (html) d.innerHTML = html;
  if (ts) {
    var tm = document.createElement('div');
    tm.className = 'mtime';
    tm.textContent = fmtTime(ts);
    d.appendChild(tm);
  }
  if (role === 'ai' && typeof msgIdx === 'number') attachActions(d, msgIdx);
  $('chat').appendChild(d);
  $('chat').scrollTop = $('chat').scrollHeight;
  return d;
}
// ---------- AI消息操作：复制 / 重新回答 ----------
function attachActions(div, idx){
  if (!div || div.querySelector('.msg-actions')) return;
  var bar = document.createElement('div');
  bar.className = 'msg-actions';
  var cb = document.createElement('button');
  cb.className = 'act-btn'; cb.textContent = '📋 复制';
  cb.onclick = function(e){ e.stopPropagation(); copyMsg(idx, cb); };
  var rb = document.createElement('button');
  rb.className = 'act-btn'; rb.textContent = '🔄 重新回答';
  rb.onclick = function(e){ e.stopPropagation(); regenMsg(idx); };
  bar.appendChild(cb); bar.appendChild(rb);
  div.appendChild(bar);
}
function msgText(idx){
  var m = messages[idx];
  if (!m) return '';
  if (Array.isArray(m.content)) {
    return m.content.map(function(p){ return p.type === 'text' ? String(p.text || '') : '[图片]'; }).join('\n');
  }
  return String(m.content || '');
}
function copyMsg(idx, btn){
  var t = msgText(idx);
  if (!t) return;
  function done(){
    if (btn) { var o = btn.textContent; btn.textContent = '✅ 已复制'; setTimeout(function(){ btn.textContent = o; }, 1500); }
  }
  function fallback(){
    var ta = document.createElement('textarea');
    ta.value = t; ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { document.execCommand('copy'); done(); } catch(e){}
    document.body.removeChild(ta);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(done, fallback);
  } else fallback();
}
function regenMsg(idx){
  if (sending) return;
  var ai = messages[idx];
  if (!ai || ai.role !== 'assistant') return;
  var user = messages[idx - 1];
  if (!user || user.role !== 'user') return;
  if (!confirm('重新生成这条回答？')) return;
  messages.splice(idx, 1);
  renderMessages();
  saveHistory();
  doSend();
}
function fmtTime(t){
  var d = new Date(t);
  var now = new Date();
  var hm = d.getHours() + ':' + ('0'+d.getMinutes()).slice(-2);
  if (d.toDateString() === now.toDateString()) return hm;
  return (d.getMonth()+1) + '-' + d.getDate() + ' ' + hm;
}
function showErr(t){
  var d = document.createElement('div');
  d.className = 'err'; d.textContent = t;
  $('chat').appendChild(d);
  $('chat').scrollTop = $('chat').scrollHeight;
}
// newBtn 绑定见下方 bindLogin 后
$('input').addEventListener('input', function(){

// 推理等级滑杆：关闭 / 小梁(low) / 梁子(high) / 梁圣(max)，默认梁子
// 联网搜索：右侧小开关。两者集中在同一控制区。
var EFFORTS = [{k:'off',n:'关闭'},{k:'low',n:'小难梁'},{k:'high',n:'梁子'},{k:'max',n:'梁圣'}];
var effortIdx = 2, webOn = false;
try {
  var se = localStorage.getItem('ds_effort');
  if (se) { for (var ei = 0; ei < EFFORTS.length; ei++) if (EFFORTS[ei].k === se) effortIdx = ei; }
  else if (localStorage.getItem('ds_think') === '0') { effortIdx = 0; }
  webOn = localStorage.getItem('ds_web') === '1';
} catch(e){}
function syncThinkUI(){
  var s = $('effortSlider');
  s.value = effortIdx;
  $('effortName').textContent = EFFORTS[effortIdx].n;
  var p = (effortIdx / 3 * 100);
  s.style.setProperty('--trackbg', 'linear-gradient(90deg,#6d28d9 0%,#4a9eff ' + p + '%,#2c2c36 ' + p + '%)');
  var ts = document.querySelectorAll('#effortTicks span');
  for (var i = 0; i < ts.length; i++) ts[i].classList.toggle('on', i === effortIdx);
  $('modelSel').value = effortIdx === 0 ? 'deepseek-v4-flash' : 'deepseek-v4-pro';
  $('webSwitch').classList.toggle('on', webOn);
}
function setEffort(i){
  effortIdx = i;
  try { localStorage.setItem('ds_effort', EFFORTS[i].k); } catch(e){}
  syncThinkUI();
}
$('effortSlider').oninput = function(){ setEffort(parseInt(this.value, 10)); };
$('webSwitch').onclick = function(){
  webOn = !webOn;
  try { localStorage.setItem('ds_web', webOn ? '1' : '0'); } catch(e){}
  $('webSwitch').classList.toggle('on', webOn);
};
syncThinkUI();
// 图片上传（仅 deepseek-v4-flash 支持看图）
var pendingImage = null; // dataURL
$('imgBtn').onclick = function(){ $('imgInput').click(); };
$('imgRemove').onclick = function(){ pendingImage = null; $('imgPreview').style.display = 'none'; $('imgInput').value = ''; };
$('imgInput').onchange = function(){
  var f = this.files[0];
  if (!f) return;
  if (f.size > 10*1024*1024) { alert('图片太大，请选10MB以内的'); return; }
  var rd = new FileReader();
  rd.onload = function(){
    // 压缩到最长边1024
    var img = new Image();
    img.onload = function(){
      var max = 1024, w = img.width, h = img.height;
      if (w > max || h > max) {
        var r = Math.min(max/w, max/h); w = Math.round(w*r); h = Math.round(h*r);
      }
      var c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      pendingImage = c.toDataURL('image/jpeg', 0.85);
      $('imgPrevImg').src = pendingImage;
      $('imgPreview').style.display = 'block';
    };
    img.src = rd.result;
  };
  rd.readAsDataURL(f);
};
// 顶部模型下拉框反向同步到滑杆：flash→关闭，pro→梁子
$('modelSel').onchange = function(){
  setEffort(this.value === 'deepseek-v4-pro' ? 2 : 0);
  if (this.value === 'deepseek-v4-pro' && pendingImage) {
    alert('Pro 模型不支持看图，图片将被忽略（把推理等级拖到"关闭"可看图）');
  }
};
function stopGen(){
  if (aborter) aborter.abort();
}
async function send(){
  var text = $('input').value.trim();
  if (!text || sending) return;
  var imgData = pendingImage;
  pendingImage = null; $('imgPreview').style.display = 'none'; $('imgInput').value = '';
  var useVision = imgData && $('modelSel').value === 'deepseek-v4-flash';
  if (imgData && !useVision) { showErr('当前模型不支持看图，已忽略图片'); imgData = null; }
  var userContent;
  if (useVision) {
    userContent = [ { type:'text', text:text }, { type:'image_url', image_url:{ url: imgData } } ];
  } else {
    userContent = text;
  }
  var msgTs = Date.now();
  messages.push({ role:'user', content: userContent, t: msgTs });
  var userHtml = md(text);
  if (useVision) userHtml = '<img src="' + imgData + '" style="max-width:100%;border-radius:10px;margin-bottom:8px"><br>' + userHtml;
  addMsg('user', userHtml, msgTs);
  $('input').value = ''; $('input').style.height = 'auto';
  doSend();
}
async function doSend(){
  if (sending) return;
  var hint = document.querySelector('.hint');
  if (hint) hint.remove();
  sending = true;
  var btn = $('sendBtn'); btn.textContent = '■'; btn.classList.add('stop');
  var aiTs = Date.now();
  var aiDiv = addMsg('ai', '', aiTs);
  if (webOn) {
    var wb = document.createElement('div');
    wb.style.cssText = 'font-size:12px;color:#4a9eff;margin-bottom:6px';
    wb.textContent = '🌐 联网搜索已开启';
    aiDiv.appendChild(wb);
  }
  var thinkDiv = null, bodyDiv = null;
  var thinkText = '', bodyText = '';
  var isReasoner = $('modelSel').value === 'deepseek-reasoner';
  aborter = new AbortController();
  try {
    var tsToken = '';
    try { if (chatTsId !== null && window.turnstile) tsToken = turnstile.getResponse(chatTsId); } catch(e){}
    if (effortIdx > 0) curThink = EFFORTS[effortIdx].n;
    if (webOn) curWeb = true;
    var resp = await fetch('/api/chat', {
      method:'POST',
      headers: authHeaders(),
      body: JSON.stringify({ model: $('modelSel').value, messages: messages, turnstile: tsToken, websearch: webOn, effort: EFFORTS[effortIdx].k }),
      signal: aborter.signal,
    });
    if (!resp.ok) {
      var ej = await resp.json().catch(function(){ return {}; });
      if (resp.status === 401) { showLogin(); throw new Error('请先登录'); }
      throw new Error(ej.error || ('请求失败(' + resp.status + ')'));
    }
    var reader = resp.body.getReader();
    var dec = new TextDecoder();
    var buf = '';
    aiDiv.classList.add('cursor');
    while (true) {
      var r = await reader.read();
      if (r.done) break;
      buf += dec.decode(r.value, { stream:true });
      var lines = buf.split('\n');
      buf = lines.pop();
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i].trim();
        if (!line || line.indexOf('data:') !== 0) continue;
        var payload = line.slice(5).trim();
        if (payload === '[DONE]') break;
        try {
          var j = JSON.parse(payload);
          var delta = (((j.choices||[])[0]||{}).delta) || {};
          if (delta.reasoning_content) {
            thinkText += delta.reasoning_content;
            if (!thinkDiv) { thinkDiv = document.createElement('div'); thinkDiv.className = 'think'; aiDiv.appendChild(thinkDiv); }
            thinkDiv.innerHTML = '<div class="think-head">💭 思考中…</div><div class="think-body">' + escHtml(thinkText.slice(-2000)) + '</div>';
          }
          if (delta.content) {
            bodyText += delta.content;
            if (!bodyDiv) { bodyDiv = document.createElement('div'); aiDiv.appendChild(bodyDiv); }
            bodyDiv.innerHTML = md(bodyText);
          }
        } catch(e){}
      }
      $('chat').scrollTop = $('chat').scrollHeight;
    }
    if (thinkDiv) {
      thinkDiv.className = 'think done';
      thinkDiv.innerHTML = '<div class="think-head">💭 思考过程 ▸ 点击展开</div><div class="think-body">' + escHtml(thinkText) + '</div>';
      thinkDiv.onclick = function(){
        var open = this.classList.toggle('open');
        this.querySelector('.think-head').textContent = open ? '💭 思考过程 ▾ 点击收起' : '💭 思考过程 ▸ 点击展开';
      };
    }
    aiDiv.classList.remove('cursor');
    messages.push({ role:'assistant', content: bodyText, t: Date.now() });
    attachActions(aiDiv, messages.length - 1);
  } catch(e) {
    aiDiv.classList.remove('cursor');
    if (e.name === 'AbortError') {
      if (bodyText) { messages.push({ role:'assistant', content: bodyText, t: Date.now() }); attachActions(aiDiv, messages.length - 1); }
      else aiDiv.remove();
    } else {
      aiDiv.remove();
      showErr(e.message || '请求失败');
    }
  }
  sending = false;
  btn.textContent = '➤'; btn.classList.remove('stop');
  aborter = null;
  try { if (chatTsId !== null && window.turnstile) turnstile.reset(chatTsId); } catch(e){}
  saveHistory();
}

var fbTsId = null;
function fbToast(m){ var t=$('fbToast'); t.textContent=m; t.style.display='block'; clearTimeout(t._t); t._t=setTimeout(function(){t.style.display='none'},2200); }
function fbShowErr(m){ var e=$('fbErr'); e.textContent=m; e.style.display='block'; }
// 反馈按钮可拖动（松手后记住位置）
var fbDragMoved = false;
(function(){
  var btn = $('fbBtn');
  try {
    var p = JSON.parse(localStorage.getItem('ds_fbPos') || 'null');
    if (p && typeof p.top === 'number' && typeof p.left === 'number') {
      btn.style.top = p.top + 'px'; btn.style.left = p.left + 'px';
      btn.style.right = 'auto'; btn.style.bottom = 'auto';
    }
  } catch(e){}
  var sx, sy, ox, oy, dragging = false;
  btn.addEventListener('pointerdown', function(e){
    sx = e.clientX; sy = e.clientY;
    var r = btn.getBoundingClientRect(); ox = r.left; oy = r.top;
    dragging = false;
    try { btn.setPointerCapture(e.pointerId); } catch(e2){}
  });
  btn.addEventListener('pointermove', function(e){
    if (sx === undefined) return;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    if (!dragging && Math.abs(dx) + Math.abs(dy) > 10) dragging = true;
    if (!dragging) return;
    var nl = Math.min(Math.max(0, ox + dx), window.innerWidth - btn.offsetWidth);
    var nt = Math.min(Math.max(0, oy + dy), window.innerHeight - btn.offsetHeight);
    btn.style.left = nl + 'px'; btn.style.top = nt + 'px';
    btn.style.right = 'auto'; btn.style.bottom = 'auto';
  });
  function endDrag(){
    if (dragging) {
      fbDragMoved = true;
      var r = btn.getBoundingClientRect();
      try { localStorage.setItem('ds_fbPos', JSON.stringify({top: Math.round(r.top), left: Math.round(r.left)})); } catch(e){}
    }
    sx = undefined; dragging = false;
  }
  btn.addEventListener('pointerup', endDrag);
  btn.addEventListener('pointercancel', function(){ sx = undefined; dragging = false; });
})();
$('fbBtn').onclick = function(){
  if (fbDragMoved) { fbDragMoved = false; return; }
  $('fbWrap').classList.add('show');

// ---------- 登录 + 云端历史 ----------
var authToken = null, authUser = null;
try { authToken = localStorage.getItem('ds_token'); authUser = localStorage.getItem('ds_user'); } catch(e){}
function getDeviceId(){ try { var d = localStorage.getItem('ds_dev'); if(!d){ d = 'd'+Date.now().toString(36)+Math.random().toString(36).slice(2,9); localStorage.setItem('ds_dev', d); } return d; } catch(e){ return ''; } }
function authHeaders(){ return { 'Content-Type':'application/json', 'Authorization':'Bearer ' + (authToken||''), 'X-Device-Id': getDeviceId() }; }
function showLogin(){ var w=document.getElementById('loginWrap'); if(w) w.classList.remove('hide'); ; ensureLoginTs(); }
function hideLogin(){ var w=document.getElementById('loginWrap'); if(w) w.classList.add('hide'); }
function loginErr(m){ var e=document.getElementById('loginErr'); if(e){ e.textContent=m; e.style.display='block'; } }
async function doAuth(action){
  var uEl=document.getElementById('loginUser'), pEl=document.getElementById('loginPass');
  if(!uEl||!pEl){ loginErr('页面加载异常，请刷新'); return; }
  var u=uEl.value.trim(), p=pEl.value.trim();
  var e=document.getElementById('loginErr'); if(e) e.style.display='none';
  if(!/^[a-zA-Z]{1,8}$/.test(u)){ loginErr('用户名为1-8个字母'); return; }
  if(!/^[0-9]{1,10}$/.test(p)){ loginErr('密码为1-10位数字'); return; }
  loginErr('请求中…'); e.style.display='block'; e.style.color='#9a9aa3';
  try{
    var tsToken='';
  try { if (loginTsId !== null && window.turnstile) tsToken = turnstile.getResponse(loginTsId); } catch(e){}
  var r=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json','X-Device-Id':getDeviceId()},body:JSON.stringify({action:action,username:u,password:p,turnstile:tsToken})});
    var txt=await r.text(), j={};
    try{ j=JSON.parse(txt); }catch(je){ loginErr('服务器返回异常: '+txt.slice(0,80)); e.style.color='#ff8ba0'; return; }
    if(!j.ok){ loginErr(j.error||'失败'); e.style.color='#ff8ba0'; return; }
    try { if (loginTsId !== null && window.turnstile) turnstile.reset(loginTsId); } catch(e){}
    authToken=j.token; authUser=j.username;
    try{ localStorage.setItem('ds_token',authToken); localStorage.setItem('ds_user',authUser); }catch(e2){}
    hideLogin();
    var b=document.getElementById('userBadge'); if(b) b.textContent='👤 '+authUser;
    loadHistory();
  }catch(err){ loginErr('网络错误: '+(err&&err.message||'')); var e2=document.getElementById('loginErr'); if(e2) e2.style.color='#ff8ba0'; }
}
function showUserModal(){
  var n=document.getElementById('uinfoName'); if(n) n.textContent=authUser||'-';
  var m=document.getElementById('userModal'); if(m) m.classList.add('show');
}
function closeUserModal(){ var m=document.getElementById('userModal'); if(m) m.classList.remove('show'); }
function doLogout(){
  closeUserModal();
  authToken=null; authUser=null;
  try{ localStorage.removeItem('ds_token'); localStorage.removeItem('ds_user'); }catch(e){}
  messages=[]; document.getElementById('chat').innerHTML='';
  var ub=document.getElementById('userBadge'); if(ub) ub.textContent='👤';

}
var loginTsId = null;
function renderLoginTs(){
  fetch('/api/turnstile-key').then(function(r){return r.json()}).then(function(j){
    var el = document.getElementById('loginTs');
    if (j.siteKey && el && el.children.length === 0 && window.turnstile) {
      loginTsId = turnstile.render('#loginTs', { sitekey: j.siteKey, theme: 'dark' });
    }
  }).catch(function(){});
}
function ensureLoginTs(){
  if (!window.turnstile) {
    var sc = document.createElement('script');
    sc.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js';
    sc.onload = function(){ renderLoginTs(); renderChatTs(); };
    document.head.appendChild(sc);
  } else renderLoginTs();
}
function bindLogin(){
  var pe=document.getElementById('loginPass');
  if(pe) pe.addEventListener('keydown',function(ev){ if(ev.key==='Enter') doAuth('login'); });
  var ub=document.getElementById('userBadge');
  if(ub) ub.onclick=function(){ showUserModal(); };

var saveTimer=null;
var curConvId=null, convListCache=[];
var curThink='', curWeb=false; // 当前对话用过的推理等级（''/小梁/梁子/梁圣）/联网
function saveHistory(){
  if(!authToken) return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){
    if(!messages.length && !curConvId) return;
    fetch('/api/conv',{method:'POST',headers:authHeaders(),body:JSON.stringify({id:curConvId,messages:messages,think:curThink,web:curWeb})})
    .then(function(r){return r.json();}).then(function(j){
      if(j.ok && j.id && !curConvId){ curConvId=j.id; }
    }).catch(function(){});
  },1500);
}
function renderHistList(){
  var el=document.getElementById('histList'); if(!el) return;
  if(!convListCache.length){ el.innerHTML='<div style="text-align:center;color:var(--muted);padding:20px;font-size:14px">暂无历史对话</div>'; return; }
  var h='';
  convListCache.forEach(function(c){
    var d=new Date(c.t); var ds=(d.getMonth()+1)+'-'+d.getDate()+' '+d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');
    var t=String(c.title||'新对话').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    h+='<div class="hist-item'+(c.id===curConvId?' active':'')+'" onclick="openConv(\''+c.id+'\')"><div class="t">'+t+'</div><div class="d"><span>'+ds+'</span><span class="del" onclick="event.stopPropagation();delConv(\''+c.id+'\')">删除</span></div></div>';
  });
  el.innerHTML=h;
}
async function refreshConvList(){
  if(!authToken) return;
  try{
    var r=await fetch('/api/convs',{headers:authHeaders()});
    var j=await r.json();
    if(j.ok){ convListCache=j.convs||[]; renderHistList(); }
  }catch(e){}
}
function openHist(){ refreshConvList(); var w=document.getElementById('histWrap'); if(w) w.classList.add('show'); }
function closeHist(){ var w=document.getElementById('histWrap'); if(w) w.classList.remove('show'); }
async function openConv(id){
  closeHist();
  if(id===curConvId) return;
  try{
    var r=await fetch('/api/conv?id='+encodeURIComponent(id),{headers:authHeaders()});
    var j=await r.json();
    if(!j.ok) return;
    curConvId=id;
    messages=Array.isArray(j.messages)?j.messages:[];
    var ce=convListCache.find(function(x){return x.id===id;});
    curThink=(ce&&ce.think)||''; curWeb=!!(ce&&ce.web);
    renderMessages();
  }catch(e){}
}
async function delConv(id){
  if(!confirm('删除这个对话？')) return;
  try{
    await fetch('/api/conv?id='+encodeURIComponent(id),{method:'DELETE',headers:authHeaders()});
    convListCache=convListCache.filter(function(c){return c.id!==id;});
    if(curConvId===id){ curConvId=null; messages=[]; curThink=''; curWeb=false; renderMessages(); }
    renderHistList();
  }catch(e){}
}
function newConversation(){
  closeHist();
  curConvId=null; messages=[]; curThink=''; curWeb=false;
  document.getElementById('chat').innerHTML='<div class="hint">👋 新对话开始<br>直接输入问题开始聊天</div>';
}
function renderMessages(){
  var chat=document.getElementById('chat'); chat.innerHTML='';
  if(!messages.length){ chat.innerHTML='<div class="hint">👋 你好，我是可乐站·DeepSeek<br>直接输入问题开始聊天，支持流式输出</div>'; return; }
  messages.forEach(function(m, i){
    var html;
    if(Array.isArray(m.content)){
      html=m.content.map(function(p){
        if(p.type==='image_url') return '<div style="color:#9a9aa3;font-size:13px">[图片]</div>';
        return md(String(p.text||''));
      }).join('');
    }else html=md(String(m.content||''));
    addMsg(m.role==='assistant'?'ai':'user',html,m.t, m.role==='assistant' ? i : null);
  });
}
async function loadHistory(){
  if(!authToken) return;
  try{
    var r=await fetch('/api/convs',{headers:authHeaders()});
    var j=await r.json();
    if(!j.ok){ if(r.status===401) showLogin(); return; }
    convListCache=j.convs||[];
    renderHistList();
    if(convListCache.length){
      openConv(convListCache[0].id);
    }else{
      renderMessages();
    }
  }catch(e){}
}
